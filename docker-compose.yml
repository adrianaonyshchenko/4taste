version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: fourtaste_postgres
    environment:
      POSTGRES_DB: FourTaste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: